# docker-compose.yml

services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: wildcard
      POSTGRES_PASSWORD: wildcardpassword
      POSTGRES_DB: wildcard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildcard -d wildcard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
